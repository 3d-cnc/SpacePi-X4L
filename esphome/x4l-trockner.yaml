# ESP32-C3 SuperMini als WLAN-Bruecke fuer den Creality SpacePi X4L mit eigener Firmware (ab 1.3.0).
# Verbindung: ESP GPIO20 (RX) <- Trockner J26 TX, ESP GPIO21 (TX) -> Trockner J26 RX, GND <-> GND.
# Die Sicherheit (Luefterpflicht, Temperaturgrenzen) liegt komplett im Trockner.
#
# Bauen und per USB flashen:   esphome run x4l-trockner.yaml
# Danach geht jedes Update per WLAN (OTA).

esphome:
  name: x4l-trockner
  friendly_name: SpacePi X4L
  comment: Filamenttrockner mit eigener Firmware

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  hardware_uart: USB_SERIAL_JTAG     # Log ueber USB, UART0-Pins bleiben fuer den Trockner frei

api:
  encryption:
    key: !secret api_schluessel

ota:
  - platform: esphome
    password: !secret ota_passwort

wifi:
  ssid: !secret wlan_name
  password: !secret wlan_passwort
  # ESP32-C3 SuperMini: bei voller Sendeleistung scheitert die Anmeldung ("Auth Expired",
  # "4-Way Handshake Timeout", 10.11.2026) - bekanntes Antennenproblem dieser Platine.
  output_power: 8.5dB
  # Versorgung aus dem 5-V-Linearregler des Trockners (AMS1117 an 12 V): Stromsparmodus
  # halbiert etwa den mittleren Strom und damit die Waerme im Regler.
  power_save_mode: light
  ap:
    ssid: X4L-Trockner-Einrichtung    # Notfall-Zugang, falls das WLAN nicht erreichbar ist

captive_portal:

web_server:
  port: 80

uart:
  id: uart_trockner
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 115200

x4l:
  id: trockner
  uart_id: uart_trockner

# ---------------- Thermostate ----------------
climate:
  - platform: x4l
    name: Kammer links
    kammer: links
  - platform: x4l
    name: Kammer rechts
    kammer: rechts

# ---------------- Messwerte ----------------
sensor:
  - platform: template
    name: Links Temperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: return id(trockner).kammer(0).temperatur;
  - platform: template
    name: Rechts Temperatur
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: return id(trockner).kammer(1).temperatur;
  - platform: template
    name: Links Feuchte
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(trockner).kammer(0).feuchte;
  - platform: template
    name: Rechts Feuchte
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: return id(trockner).kammer(1).feuchte;
  - platform: template
    name: Links Heizflaeche
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(trockner).kammer(0).heizflaeche;
  - platform: template
    name: Rechts Heizflaeche
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(trockner).kammer(1).heizflaeche;
  - platform: template
    name: Links Heizleistung
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(trockner).kammer(0).leistung;
  - platform: template
    name: Rechts Heizleistung
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 10s
    lambda: return id(trockner).kammer(1).leistung;
  - platform: template
    name: Links Restzeit
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      auto &k = id(trockner).kammer(0);
      return k.laeuft ? (k.rest_s + 59) / 60 : 0;
  - platform: template
    name: Rechts Restzeit
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      auto &k = id(trockner).kammer(1);
      return k.laeuft ? (k.rest_s + 59) / 60 : 0;
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
  - platform: template
    name: Zeilen vom Trockner
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: return id(trockner).zeilen_ok();
  - platform: template
    name: Verworfene Zeilen
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: return id(trockner).zeilen_fehler();

binary_sensor:
  - platform: template
    name: Verbindung zum Trockner
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(trockner).verbunden();
  - platform: template
    name: Links Luefter
    device_class: running
    lambda: return id(trockner).kammer(0).luefter;
  - platform: template
    name: Rechts Luefter
    device_class: running
    lambda: return id(trockner).kammer(1).luefter;
  - platform: template
    name: Links Stoerung
    device_class: problem
    lambda: return id(trockner).kammer(0).fehler != 0;
  - platform: template
    name: Rechts Stoerung
    device_class: problem
    lambda: return id(trockner).kammer(1).fehler != 0;

text_sensor:
  - platform: template
    name: Links Fehler
    update_interval: 5s
    lambda: |-
      static const char *const T[] = {"keiner", "1 Kammersensor", "2 Heizungsfuehler", "3 Heizflaeche zu heiss",
                                      "4 Kammer zu heiss", "5 Heizung schaltet nicht ab - Netzstecker ziehen!",
                                      "6 Heizung heizt nicht"};
      int f = id(trockner).kammer(0).fehler;
      return std::string(f >= 0 && f <= 6 ? T[f] : "unbekannt");
  - platform: template
    name: Rechts Fehler
    update_interval: 5s
    lambda: |-
      static const char *const T[] = {"keiner", "1 Kammersensor", "2 Heizungsfuehler", "3 Heizflaeche zu heiss",
                                      "4 Kammer zu heiss", "5 Heizung schaltet nicht ab - Netzstecker ziehen!",
                                      "6 Heizung heizt nicht"};
      int f = id(trockner).kammer(1).fehler;
      return std::string(f >= 0 && f <= 6 ? T[f] : "unbekannt");
  - platform: template
    name: Firmware Trockner
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(trockner).version();

# ---------------- Einstellungen ----------------
select:
  - platform: template
    name: Links Material
    options: ["PLA", "PETG", "ABS", "ASA", "TPU", "PA", "PC", "USER"]
    update_interval: 5s
    lambda: |-
      int m = id(trockner).kammer(0).material;
      return std::string(m >= 0 && m < x4l::ANZAHL_MATERIALIEN ? x4l::MATERIALIEN[m] : "PLA");
    set_action:
      - lambda: |-
          for (int i = 0; i < x4l::ANZAHL_MATERIALIEN; i++)
            if (x == x4l::MATERIALIEN[i]) id(trockner).befehl("MAT", 0, i);
  - platform: template
    name: Rechts Material
    options: ["PLA", "PETG", "ABS", "ASA", "TPU", "PA", "PC", "USER"]
    update_interval: 5s
    lambda: |-
      int m = id(trockner).kammer(1).material;
      return std::string(m >= 0 && m < x4l::ANZAHL_MATERIALIEN ? x4l::MATERIALIEN[m] : "PLA");
    set_action:
      - lambda: |-
          for (int i = 0; i < x4l::ANZAHL_MATERIALIEN; i++)
            if (x == x4l::MATERIALIEN[i]) id(trockner).befehl("MAT", 1, i);

number:
  - platform: template
    name: Links Dauer
    unit_of_measurement: min
    min_value: 30
    max_value: 2880
    step: 30
    mode: box
    update_interval: 5s
    lambda: return id(trockner).kammer(0).dauer_min;
    set_action:
      - lambda: id(trockner).befehl("DAUER", 0, (int) x);
  - platform: template
    name: Rechts Dauer
    unit_of_measurement: min
    min_value: 30
    max_value: 2880
    step: 30
    mode: box
    update_interval: 5s
    lambda: return id(trockner).kammer(1).dauer_min;
    set_action:
      - lambda: id(trockner).befehl("DAUER", 1, (int) x);

button:
  - platform: template
    name: Links Fehler quittieren
    on_press:
      - lambda: id(trockner).befehl("QUIT", 0);
  - platform: template
    name: Rechts Fehler quittieren
    on_press:
      - lambda: id(trockner).befehl("QUIT", 1);
  - platform: restart
    name: ESP neu starten
    entity_category: config
